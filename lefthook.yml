# Lefthook gates: secrets + compile before commit, full gates before push.
# Install once per clone: lefthook install
# CI mirrors these gates in .github/workflows/ci.yml.

min_version: 1.7.0

pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --verbose --config .gitleaks.toml

    py-compile:
      glob: "*.py"
      run: python3 -m py_compile {staged_files}

pre-push:
  commands:
    gitleaks-history:
      run: gitleaks detect --redact --verbose --config .gitleaks.toml

    py-compile-all:
      glob: "*.py"
      run: python3 -m py_compile {all_files}

    md-links:
      glob: "*.md"
      run: python3 scripts/check_links.py {all_files}
