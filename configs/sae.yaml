# SAE + training hyperparameters for LFM3-1.7B-Base interpretability.
# (Kept for the SAE pipeline; the neuron steering scripts take CLI args instead.)

model:
  model_id: "LiquidAI/LFM3-1.7B-Base"
  dtype: "bfloat16"
  device: "mps"
  hidden_size: 2048
  intermediate_size: 7680   # SwiGLU MLP intermediate = the "neurons" this repo steers
  num_layers: 24

sae:
  layer: 6                  # target layer (0-23); layer 6 = 2nd global-attention layer
  d_in: 7680                # MLP intermediate width
  d_sae: 16384
  k: 64
  lr: 0.001
  batch_size: 256
  num_epochs: 10
  l1_coeff: 0.0003
  seed: 42

extract:
  dataset: "roneneldan/TinyStories"
  split: "train"
  max_samples: 5000
  max_tokens_per_sample: 512
  batch_size: 8
  layers: [6]
  activation_type: "mlp_intermediate"
  output_dir: "./data/activations"
