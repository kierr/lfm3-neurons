[project]
name = "lfm3-neurons"
version = "1.0.0"
description = "Single-neuron personality steering in LiquidAI LFM3-1.7B-Base, on Apple Silicon (PyTorch + MPS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.5",
    "transformers>=4.50",
    "datasets>=3.0",
    "numpy",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lfm3_neurons*"]
